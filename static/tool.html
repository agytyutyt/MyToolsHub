<!DOCTYPE html>
<!-- JZToolsHub 工具外壳页
 * 布局与管理后台一致：左侧导航栏 + 插件主体全幅直出，不再套卡片外框。
 * 工具本体以 iframe 方式加载 /plugin/<id>/<entry>，与框架及插件之间互不污染；
 * 元信息（入口地址）由 static/js/tool.js 通过 /api/tools/<id> 获取。
 * 左侧导航栏由 static/js/sidebar.js 构建：首项为「返回」，底部为用户区。
 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具</title>
  <link rel="stylesheet" href="/static/css/style.css?v=19">
  <link rel="stylesheet" href="/plugin/admin/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234285F4'/><text x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='58' font-weight='bold' fill='%23ffffff' text-anchor='middle'>JZ</text></svg>">
</head>
<body class="tool-body" data-page="tool">
  <!-- 插件主体：占满侧栏以右全部空间，无边框无留白 -->
  <main class="tool-stage" id="tool-stage">
    <iframe class="tool-frame" id="tool-frame" title="工具内容"></iframe>
  </main>

  <script src="/static/js/jz-icon.js?v=6"></script>
  <script src="/plugin/admin/js/admin-common.js?v=8"></script>
  <script src="/static/js/sidebar.js?v=4"></script>
  <script src="/static/js/tool.js?v=4"></script>
  <!-- 大模型设置：按后端模式放开侧栏「大模型设置」项并承载其对话框 -->
  <script src="/static/js/llm-settings.js?v=4"></script>
  <script src="/static/js/shell-bridge.js?v=1"></script>
</body>
</html>
