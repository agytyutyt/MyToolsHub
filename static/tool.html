<!DOCTYPE html>
<!-- JZToolsHub 工具外壳页
 * 布局与管理后台一致：顶Bar + 插件主体全幅直出，不再套卡片外框。
 * 工具本体以 iframe 方式加载 /plugin/<id>/<entry>，与框架及插件之间互不污染；
 * 元信息（入口地址）由 static/js/tool.js 通过 /api/tools/<id> 获取。
 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具</title>
  <link rel="stylesheet" href="/static/css/style.css?v=14">
  <link rel="stylesheet" href="/plugin/admin/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234285F4'/><text x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='58' font-weight='bold' fill='%23ffffff' text-anchor='middle'>JZ</text></svg>">
</head>
<body class="tool-body">
    <!-- 顶部应用栏：返回按钮（直链首页，避免会话过期重登录后 history.back 退回登录页） -->
    <header class="app-bar">
      <a href="/" class="back-btn" title="返回首页">←</a>
    <a href="/" class="logo">
      <span class="logo-mark"></span>
      <span class="logo-title" id="site-title">JZ 工具箱</span>
    </a>
    <div class="spacer"></div>
    <div class="user-menu" id="user-slot"></div>
  </header>

  <!-- 插件主体：占满顶Bar以下全部空间，无边框无留白 -->
  <main class="tool-stage" id="tool-stage">
    <iframe class="tool-frame" id="tool-frame" title="工具内容"></iframe>
  </main>

  <script src="/static/js/jz-icon.js?v=3"></script>
  <script src="/plugin/admin/js/admin-common.js"></script>
  <script src="/static/js/tool.js?v=3"></script>
</body>
</html>
