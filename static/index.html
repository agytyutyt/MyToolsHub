<!DOCTYPE html>
<!-- JZToolsHub 首页
 * 工具卡片由 static/js/main.js 读取 /api/tools 动态渲染，
 * 站点标题 / 副标题 / 页脚等文案均来自 config/tools.json 的 site 段。
 * 左侧导航栏由 static/js/sidebar.js 构建（原顶栏与右下角悬浮球的功能收拢处）。
 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JZ 工具箱</title>
  <link rel="stylesheet" href="/static/css/style.css?v=21">
  <link rel="stylesheet" href="/plugin/admin/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234285F4'/><text x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='58' font-weight='bold' fill='%23ffffff' text-anchor='middle'>JZ</text></svg>">
</head>
<body data-page="home">

  <!-- 首屏标语区 -->
  <section class="hero">
    <h1 id="hero-title">工具箱</h1>
    <p id="hero-subtitle">一切皆插件 · 配置驱动的工具集合</p>
  </section>

  <!-- 主内容区：JS 按分类动态插入工具卡片 -->
  <main class="content" id="content">
    <div class="tool-grid" id="tool-grid">
      <div class="loading">加载中…</div>
    </div>
  </main>

  <!-- 右侧分类快速定位标签：JS 按分类动态生成 -->
  <nav class="cat-nav" id="cat-nav" aria-label="分类快速定位"></nav>

  <!-- 页脚（文案来自配置 site.footer） -->
  <footer class="footer" id="footer"></footer>

  <!-- 编辑模式提示（入口在左侧栏「位置编辑」，main.js 控制） -->
  <div class="edit-hint" id="edit-hint" hidden>编辑模式：按住插件拖起调整顺序（分类可拖标题），自动保存；点侧栏「完成编辑」退出</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 浮窗：隐藏工具 -->
  <div class="modal" id="modal-hide" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <span class="modal-title">隐藏工具</span>
        <button type="button" class="modal-close" data-close aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="hide-group">
          <div class="hide-group-title">分类</div>
          <div class="hide-list" id="hide-cats"></div>
        </div>
        <div class="hide-group">
          <div class="hide-group-title">插件</div>
          <div class="hide-list" id="hide-tools"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/jz-icon.js?v=6"></script>
  <script src="/plugin/admin/js/admin-common.js?v=8"></script>
  <script src="/static/js/sidebar.js?v=5"></script>
  <script src="/static/js/main.js?v=21"></script>
  <!-- 大模型设置：按后端模式放开侧栏「大模型设置」项并承载其对话框 -->
  <script src="/static/js/llm-settings.js?v=4"></script>
  <script src="/static/js/shell-bridge.js?v=1"></script>
</body>
</html>
