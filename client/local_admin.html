<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地插件管理</title>
<style>
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#f1f3f4;margin:0;padding:24px}
  .card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:20px 24px;margin:0 auto 16px;max-width:860px}
  h1{font-size:18px;margin:0 0 4px} a.back{font-size:13px;color:#1a73e8;text-decoration:none}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
  .ok{background:#e6f4ea;color:#137333}.blocked{background:#fce8e6;color:#c5221f}
  .disabled{background:#f1f3f4;color:#5f6368}.error{background:#fce8e6;color:#c5221f}
  button{padding:6px 12px;margin:2px;border:0;border-radius:6px;cursor:pointer;font-size:13px}
  .warn{background:#e8f0fe;color:#1a73e8}.danger{background:#fce8e6;color:#c5221f}
  #msg{margin:10px 0;font-size:13px;color:#188038;min-height:16px}
  input[type=file]{font-size:13px}
  .miss{color:#c5221f;font-size:12px}
  /* Material Design 滚动条（口径同框架 static/css/style.css，2026-10-14）：
     本页（本地插件管理）自带样式、不引框架 CSS，表格与页面纵向滑块此前是 Chromium 默认样式。 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#dadce0;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#bdc1c6}
  ::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>
<div class="card">
  <h1>本地插件管理</h1>
  <p><a class="back" href="/">← 返回主界面</a> ·
     本地插件运行于本机：类 C（混合）可访问服务器数据，类 B 纯本地。
     <b>安装 / 升级 / 停用 / 卸载请优先使用「插件商店」</b>（主界面或左侧栏入口）；
     本页保留为兜底（离线装包）与依赖页签。</p>
  <input type="file" id="pkg" accept=".zip">
  <button class="warn" onclick="install()">安装 / 升级插件包</button>
  <button class="warn" onclick="checkUpdate()">检查更新</button>
  <button class="warn" onclick="loadDeps()">查看依赖组件</button>
  <div id="msg"></div>
</div>
<div class="card" id="dep-card" hidden>
  <h3>依赖组件（runtime/pylibs）</h3>
  <table id="dep-tbl"><thead><tr>
    <th>组件</th><th>版本</th><th>状态</th>
  </tr></thead><tbody></tbody></table>
  <p style="font-size:12px;color:#5f6368">依赖组件的安装/升级走「插件商店 · 依赖」页签（含联合安装）；
     DLL 类组件在下次启动能力层时生效。</p>
</div>
<div class="card">
  <table id="tbl"><thead><tr>
    <th>插件</th><th>版本</th><th>形态</th><th>状态</th><th>操作</th>
  </tr></thead><tbody></tbody></table>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function msg(t){document.getElementById("msg").textContent=t;}
function load(){
  fetch("/local-api/plugins").then(r=>r.json()).then(d=>{
    const tb=document.querySelector("#tbl tbody"); tb.innerHTML="";
    (d.plugins||[]).forEach(p=>{
      const st=p.state||{}, cls=esc(st.status||"ok");
      const missing=(st.missing||[]).map(esc).join("、");
      const tr=document.createElement("tr");
      tr.innerHTML="<td><b>"+esc(p.name)+"</b><br><span class='miss'>"+esc(p.id)+"</span></td>"
        +"<td>"+esc(p.version)+"</td><td>"+esc(p.kind)+"/"+esc(p.mount||"-")+"</td>"
        +"<td><span class='tag "+cls+"'>"+esc(st.status||"ok")+"</span>"
        + (missing? "<br><span class='miss'>缺："+missing+"</span>":"") +"</td>"
        +"<td><button class='warn' onclick='toggle(\""+esc(p.id)+"\","+(!p.enabled)+")'>"
        + (p.enabled?"停用":"启用") +"</button>"
        + "<button class='danger' onclick='uninstall(\""+esc(p.id)+"\")'>卸载</button></td>";
      tb.appendChild(tr);
    });
    if(!(d.plugins||[]).length) tb.innerHTML="<tr><td colspan=5>尚未安装本地插件</td></tr>";
  });
}
function toggle(id,enable){
  fetch("/local-api/plugins/state",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:id,enabled:enable})}).then(r=>r.json()).then(d=>{
      msg(d.restart_required?"需要重启能力层生效（会话已保留）":"已即时生效"); load();});
}
function uninstall(id){
  if(!confirm("确认卸载 "+id+"？")) return;
  fetch("/local-api/plugins/uninstall",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:id})}).then(r=>r.json()).then(d=>{
      msg(d.restart_required?"已卸载，需重启能力层生效":"已卸载"); load();});
}
function install(){
  const f=document.getElementById("pkg").files[0];
  if(!f){msg("请先选择插件包（zip）");return;}
  const fd=new FormData(); fd.append("file",f);
  fetch("/local-api/plugins/install",{method:"POST",body:fd}).then(r=>r.json())
    .then(d=>{ msg(d.ok?("安装成功："+d.id+(d.restart_required?"（需重启能力层生效）":""))
                    :("失败："+d.error)); load();})
    .catch(e=>msg("安装异常："+e));
}
function checkUpdate(){
  fetch("/local-api/plugins/check-update",{method:"POST"}).then(r=>r.json()).then(d=>{
    if(d.error){msg("检查更新："+d.error);return;}
    const up=d.updates||[];
    msg("检查更新（来源："+(d.source||"-")+"）："+(up.length+" 项"
        + up.map(u=>" "+u.id+"@"+u.version).join(";")||"暂无"));
  });
}
function loadDeps(){
  fetch("/local-api/plugins").then(r=>r.json()).then(d=>{
    document.getElementById("dep-card").hidden=false;
    const tb=document.querySelector("#dep-tbl tbody"); tb.innerHTML="";
    const rows=d.components||[];
    rows.forEach(c=>{
      const tr=document.createElement("tr");
      tr.innerHTML="<td>"+esc(c.id)+"</td><td>"+esc(c.version||"-")+"</td><td>"
        +(c.pending?"<span class='tag warn'>暂存中（重启生效）</span>":"<span class='tag ok'>已装</span>")+"</td>";
      tb.appendChild(tr);
    });
    if(!rows.length) tb.innerHTML="<tr><td colspan=3>尚未安装依赖组件</td></tr>";
  });
}
load();
</script>
</body>
</html>
