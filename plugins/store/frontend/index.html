<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件商店</title>
<link rel="stylesheet" href="/plugin/store/style.css?v=6">
</head>
<body>
<header class="st-head">
  <div>
    <h1>🛍️ 插件商店</h1>
    <p class="st-sub">插件与依赖组件的统一入口：下载 / 安装 / 升级 / 停用 / 卸载（全生命周期同权，不分管理员与办事员）。</p>
  </div>
  <div class="st-head-right">
    <input type="search" id="st-q" placeholder="搜索名称 / 说明…" autocomplete="off">
  </div>
</header>

<nav class="st-tabs" role="tablist">
  <button class="st-tab active" data-cat="plugin" role="tab" aria-selected="true">插件</button>
  <button class="st-tab" data-cat="dep" role="tab" aria-selected="false">依赖</button>
  <span id="st-msg" role="status" aria-live="polite"></span>
  <!-- target=_top：本页被工具壳 iframe 内嵌，管理页需整页导航——否则 admin-store 的侧栏会嵌进 iframe 形成双侧栏（2026-10-07） -->
  <a class="st-manage" href="/admin/store" target="_top">商店管理</a>
</nav>

<main id="st-grid" class="st-grid" aria-live="polite">
  <div class="st-empty">加载中…</div>
</main>

<script src="/plugin/store/store.js?v=7"></script>
</body>
</html>
