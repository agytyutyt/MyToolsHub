<!DOCTYPE html>
<!-- JZToolsHub 管理后台 · 单位管理（admin 插件） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单位管理 · JZ 工具箱</title>
  <link rel="stylesheet" href="/static/css/style.css?v=19">
  <link rel="stylesheet" href="/plugin/admin/css/admin.css?v=26">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234285F4'/><text x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='58' font-weight='bold' fill='%23ffffff' text-anchor='middle'>JZ</text></svg>">
</head>
<body data-page="admin" data-side-suffix=" · 单位管理">

  <main class="admin-content">
    <div class="admin-head">
      <div>
        <h1>单位管理</h1>
        <div class="admin-sub">组织结构第一级：单位下辖部门，部门下辖人员</div>
      </div>
      <div class="admin-head-actions">
        <button class="admin-btn" type="button" id="btn-template">下载模板</button>
        <button class="admin-btn" type="button" id="btn-export">导出</button>
        <button class="admin-btn" type="button" id="btn-import">批量导入</button>
        <button class="admin-btn primary" type="button" id="btn-new">＋ 新建单位</button>
      </div>
    </div>

    <div class="data-list" id="unit-list">
      <div class="loading">加载中…</div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/plugin/admin/js/admin-common.js?v=8"></script>
  <script src="/static/js/sidebar.js?v=5"></script>
  <script src="/plugin/admin/js/admin-unit.js?v=2"></script>
  <script src="/static/js/llm-settings.js?v=4"></script>
