<!DOCTYPE html>
<!-- JZToolsHub 管理后台 · 部门管理（admin 插件） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部门管理 · JZ 工具箱</title>
  <link rel="stylesheet" href="/static/css/style.css?v=19">
  <link rel="stylesheet" href="/plugin/admin/css/admin.css?v=27">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234285F4'/><text x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='58' font-weight='bold' fill='%23ffffff' text-anchor='middle'>JZ</text></svg>">
</head>
<body data-page="admin" data-side-suffix=" · 部门管理">

  <main class="admin-content">
    <div class="admin-head">
      <div>
        <h1>部门管理</h1>
        <div class="admin-sub">维护组织结构，人员可归属到具体部门</div>
      </div>
      <div class="admin-head-actions">
        <button class="admin-btn" type="button" id="btn-template">下载模板</button>
        <button class="admin-btn" type="button" id="btn-export">导出</button>
        <button class="admin-btn" type="button" id="btn-import">批量导入</button>
        <button class="admin-btn primary" type="button" id="btn-new">＋ 新建部门</button>
      </div>
    </div>

    <div class="data-list" id="dept-list">
      <div class="loading">加载中…</div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/plugin/admin/js/admin-common.js?v=11"></script>
  <script src="/static/js/sidebar.js?v=5"></script>
  <script src="/plugin/admin/js/admin-dept.js?v=2"></script>
  <script src="/static/js/llm-settings.js?v=4"></script>
</body>
</html>
