<!DOCTYPE html>
<!-- JZToolsHub 管理后台首页（admin 插件）：沿用主界面方格布局展示三个管理模块 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · JZ 工具箱</title>
  <link rel="stylesheet" href="/static/css/style.css?v=14">
  <link rel="stylesheet" href="/plugin/admin/css/admin.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234285F4'/><text x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='58' font-weight='bold' fill='%23ffffff' text-anchor='middle'>JZ</text></svg>">
</head>
<body>
  <header class="app-bar">
    <a href="/" class="logo">
      <span class="logo-mark"></span>
      <span class="logo-title">JZ 工具箱 · 管理后台</span>
    </a>
    <div class="spacer"></div>
    <div class="user-menu" id="user-slot"></div>
  </header>

  <main class="admin-content">
    <div class="admin-head">
      <div>
        <h1>管理后台</h1>
        <div class="admin-sub">部门、人员与权限统一管理</div>
      </div>
      <a class="admin-btn small" href="/admin/settings"><span data-jz-icon="⚙️"></span> 设置</a>
      <a class="admin-btn" href="/">← 返回工具箱</a>
    </div>

    <div class="tool-grid" id="admin-grid">
      <div class="loading">加载中…</div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/jz-icon.js?v=2"></script>
  <script src="/plugin/admin/js/admin-common.js?v=1"></script>
  <script src="/plugin/admin/js/admin.js?v=3"></script>
</body>
</html>
