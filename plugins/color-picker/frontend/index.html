<!DOCTYPE html>
<!-- 取色器插件（纯前端）
 * 基于 <input type="color"> 原生取色，实时换算 HEX / RGB / HSL 并支持一键复制。
 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取色器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Google Sans", "Roboto", "Segoe UI", system-ui, sans-serif;
    color: #202124; padding: 24px; max-width: 720px; margin: 0 auto;
  }
  .picker-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  #picker {
    width: 150px; height: 150px; border: none; border-radius: 16px;
    background: #efefef; cursor: pointer; padding: 0;
    box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  }
  .preview {
    width: 120px; height: 120px; border-radius: 16px; border: 1px solid #dadce0;
    box-shadow: 0 1px 3px rgba(60,64,67,.3);
  }
  .values { flex: 1; min-width: 200px; }
  .value-row {
    display: flex; align-items: center; gap: 12px; margin: 8px 0;
    padding: 10px 14px; background: #f8f9fa; border-radius: 12px;
    border: 1px solid #e8eaed;
  }
  .value-row label { width: 44px; font-size: 12px; color: #5f6368; font-weight: 600; }
  .value-row code { flex: 1; font-size: 13px; word-break: break-all; }
  .btn {
    border: none; background: #1a73e8; color: #fff; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; cursor: pointer;
    transition: filter .2s, box-shadow .2s;
  }
  .btn:hover { box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #202124; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 响应式档位（全站统一 480/767 + max-height:640，禁私有档位） ===== */
  @media (max-width:767px) {
    body { padding: 16px; width: 100%; }
    .picker-row { gap: 14px; }
  }
  @media (max-width:480px) {
    body { padding: 12px; }
    .preview { width: 96px; height: 96px; }
    .value-row { padding: 8px 10px; gap: 8px; }
    .value-row label { width: 38px; }
    .value-row .btn { padding: 7px 10px; }
  }
  @media (max-height:640px) {
    body { padding: 16px; }
    .preview { width: 96px; height: 96px; }
  }
</style>
</head>
<body>
  <div class="picker-row">
    <label for="picker" style="display:contents; cursor:pointer;">
      <input type="color" id="picker" value="#ea4335" style="position:absolute; opacity:0; width:0; height:0;">
      <div class="preview" id="preview"></div>
    </label>
    <div class="values" id="values"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const picker = document.getElementById('picker');
  const preview = document.getElementById('preview');
  const values = document.getElementById('values');
  const toast = document.getElementById('toast');

  // HEX → RGB
  function hexToRgb(hex) {
    const m = /^#([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
  }

  // RGB → HSL（s/l 返回百分比整数）
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > .5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  // 复制并给出轻提示
  function copy(text, label) {
    window.jzCopyText(text).then(() => {
      toast.textContent = label + ' 已复制';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    });
  }

  // 渲染当前颜色的 HEX / RGB / HSL，并为每个「复制」按钮绑定事件
  function render() {
    const hex = picker.value;
    preview.style.background = hex;
    const { r, g, b } = hexToRgb(hex);
    const { h, s, l } = rgbToHsl(r, g, b);
    const items = [
      ['HEX', hex.toUpperCase()],
      ['RGB', `rgb(${r}, ${g}, ${b})`],
      ['HSL', `hsl(${h}, ${s}%, ${l}%)`],
    ];
    values.innerHTML = items.map(([label, val]) => `
      <div class="value-row">
        <label>${label}</label>
        <code>${val}</code>
        <button class="btn" data-v="${val}">复制</button>
      </div>`).join('');
    values.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => copy(btn.dataset.v, btn.previousElementSibling.textContent));
    });
  }

  picker.addEventListener('input', render);
  render();
</script>
<script>window.jzCopyText=function(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.focus();a.select();try{document.execCommand("copy")?Promise.resolve():Promise.reject(new Error("copy failed"))}catch(e){Promise.reject(e)}finally{document.body.removeChild(a)}};window.jzCopyText=function(t){return (navigator.clipboard&&window.isSecureContext)?navigator.clipboard.writeText(t):new Promise(function(res,rej){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.focus();a.select();try{document.execCommand("copy")?res():rej(new Error("copy failed"))}catch(e){rej(e)}finally{document.body.removeChild(a)}})};</script>
<style>
/* ==================== 响应式（统一档位 1023/767/480；高度 640） ==================== */
@media (max-width:767px){ body{ padding:16px } }
@media (max-width:480px){ body{ padding:12px } }

@media (max-width:480px){ .panel, .card, .result { min-width:0 } }
  /* Material Design 滚动条（统一口径，同框架 static/css/style.css，2026-10-14）：
     本页自带样式、不引框架 CSS，故自带一份；细轨 10px + 透明轨道 + 圆角拇指 #dadce0，
     悬停 #bdc1c6，不渲染箭头按钮。不写 scrollbar-color/scrollbar-width（Chromium ≥121
     设了会整段忽略 ::-webkit-scrollbar，新老内核观感分叉；基线 Chrome ≥72 只认前者）。 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#dadce0;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#bdc1c6}
  ::-webkit-scrollbar-corner{background:transparent}
</style>
</body>
</html>
