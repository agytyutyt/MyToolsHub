<!DOCTYPE html>
<!-- Base64 编解码插件（纯前端）
 * 用 TextEncoder / TextDecoder 保证 UTF-8 中文正确编解码，
 * 全部处理都在浏览器本地完成，不经过后端。
 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 编解码</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Google Sans", "Roboto", "Segoe UI", system-ui, sans-serif;
    color: #202124; padding: 24px; max-width: 900px; margin: 0 auto;
  }
  .bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    border: 1px solid #dadce0; background: #fff; color: #1a73e8;
    padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background .2s, box-shadow .2s;
  }
  .btn:hover { background: #f1f5fd; box-shadow: 0 1px 2px rgba(60,64,67,.3); }
  .btn.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .btn.primary:hover { background: #1967d2; }
  textarea {
    width: 100%; height: 180px; padding: 14px; font-family: "Roboto Mono", Consolas, monospace;
    font-size: 13px; border: 1px solid #dadce0; border-radius: 12px; resize: vertical;
    outline: none; background: #fff; line-height: 1.6;
  }
  textarea:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.2); }
  .label { font-size: 13px; color: #5f6368; margin: 4px 0 8px; }
  .status { font-size: 13px; color: #5f6368; margin-top: 10px; }
  .status.error { color: #d93025; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #202124; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 响应式档位（全站统一 480/767 + max-height:640，禁私有档位） ===== */
  @media (max-width:767px) {
    body { padding: 16px; width: 100%; }
    textarea { height: 150px; }
  }
  @media (max-width:480px) {
    body { padding: 12px; }
    textarea { height: 120px; }
    .bar { gap: 8px; }
    .bar .btn { flex: 1 1 auto; min-width: 0; padding: 8px 12px; }
  }
  @media (max-height:640px) {
    body { padding: 16px; }
    textarea { height: 120px; }
    .bar { margin-bottom: 10px; }
  }
</style>
</head>
<body>
  <div class="label">输入文本（支持中文）</div>
  <textarea id="input" placeholder="在此输入要编码或解码的文本…"></textarea>
  <div class="bar">
    <button class="btn primary" id="encode">编码 ▸ Base64</button>
    <button class="btn" id="decode">解码 ▸ 文本</button>
    <button class="btn" id="clear">清空</button>
  </div>
  <div class="label">输出结果</div>
  <textarea id="output" placeholder="结果将显示在这里…" readonly></textarea>
  <button class="btn" id="copy" style="margin-top: 12px;">复制结果</button>
  <div class="status" id="status"></div>
  <div class="toast" id="toast"></div>

<script>
  // 输入 / 输出 / 状态提示 / 轻提示 四个 DOM 引用
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const toast = document.getElementById('toast');

  // UTF-8 编解码（TextEncoder 输出 Uint8Array，TextDecoder 还原字符串）
  const utf8Encode = s => new TextEncoder().encode(s);
  const utf8Decode = bytes => new TextDecoder('utf-8').decode(bytes);

  // 字节数组 <-> Base64 字符串（浏览器 API 只支持 latin1 字符串，先转成字节）
  function bytesToBase64(bytes) {
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }
  function base64ToBytes(b64) {
    const bin = atob(b64.replace(/\s+/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // 底部轻提示
  function notify(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  // 编码：文本 → Base64
  document.getElementById('encode').addEventListener('click', () => {
    try {
      output.value = bytesToBase64(utf8Encode(input.value));
      status.textContent = `已编码，长度 ${output.value.length} 字符`;
      status.classList.remove('error');
    } catch (e) { status.textContent = '编码失败'; status.classList.add('error'); }
  });

  // 解码：Base64 → 文本（非法输入会抛出异常）
  document.getElementById('decode').addEventListener('click', () => {
    try {
      output.value = utf8Decode(base64ToBytes(input.value));
      status.textContent = '解码成功';
      status.classList.remove('error');
    } catch (e) {
      status.textContent = '解码失败：输入不是合法的 Base64';
      status.classList.add('error');
    }
  });

  // 清空输入输出
  document.getElementById('clear').addEventListener('click', () => {
    input.value = output.value = '';
    status.textContent = '';
  });

  // 复制结果
  document.getElementById('copy').addEventListener('click', () => {
    if (!output.value) return;
    window.jzCopyText(output.value).then(() => notify('已复制'));
  });
</script>
<script>window.jzCopyText=function(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.focus();a.select();try{document.execCommand("copy")?Promise.resolve():Promise.reject(new Error("copy failed"))}catch(e){Promise.reject(e)}finally{document.body.removeChild(a)}};window.jzCopyText=function(t){return (navigator.clipboard&&window.isSecureContext)?navigator.clipboard.writeText(t):new Promise(function(res,rej){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.focus();a.select();try{document.execCommand("copy")?res():rej(new Error("copy failed"))}catch(e){rej(e)}finally{document.body.removeChild(a)}})};</script>
<style>
/* ==================== 响应式（统一档位 1023/767/480；高度 640） ==================== */
@media (max-width:767px){ body{ padding:16px } }
@media (max-width:480px){ body{ padding:12px } }
  /* Material Design 滚动条（统一口径，同框架 static/css/style.css，2026-10-14）：
     本页自带样式、不引框架 CSS，故自带一份；细轨 10px + 透明轨道 + 圆角拇指 #dadce0，
     悬停 #bdc1c6，不渲染箭头按钮。不写 scrollbar-color/scrollbar-width（Chromium ≥121
     设了会整段忽略 ::-webkit-scrollbar，新老内核观感分叉；基线 Chrome ≥72 只认前者）。 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#dadce0;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#bdc1c6}
  ::-webkit-scrollbar-corner{background:transparent}
</style>
</body>
</html>
