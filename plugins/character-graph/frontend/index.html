<!DOCTYPE html>
<!-- 人物关系立体星图插件（前端 + Python 后端）
 * 上传文档（小说/剧本/笔录）→ 后端调用大模型抽取人物关系 →
 * Three.js 渲染可旋转的 3D 星点图。
 * 后端接口前缀：/api/character-graph；逻辑见 js/app.js。
 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人物关系立体星图</title>
<link rel="stylesheet" href="css/style.css?v=20260814" />
</head>
<body>
  <div id="app">
    <aside id="panel">
      <h1>人物关系立体星图</h1>
      <p class="subtitle">上传文档 → 大模型提取关系 → 3D 展示</p>

      <!-- 大模型接入信息已统一到「管理后台 → 大模型设置」或首页右下角「⋯ → 大模型设置」，
           本插件不再保存 API 地址与 Key，只显示当前能不能用、用的是哪一份配置。 -->
      <section class="block" id="apiFormSection">
        <h2>大模型解析（接入信息统一配置）</h2>
        <span id="configTip" class="tip"></span>
      </section>
      <p id="apiNotice" class="notice" hidden></p>

      <section class="block">
        <h2>上传文档</h2>
        <div id="dropZone" class="dropzone">
          <p>拖拽文件到此处，或点击选择</p>
          <p class="muted">支持 .txt / .md / .docx / .pdf / .json / .csv</p>
        </div>
        <input id="fileInput" type="file" accept=".txt,.md,.docx,.pdf,.json,.csv" hidden />
        <p id="fileName" class="muted"></p>
        <button id="analyzeBtn" class="btn primary" disabled>开始分析</button>
      </section>

      <section class="block">
        <h2>关系类型图例</h2>
        <div id="legend"></div>
      </section>

      <section class="block">
        <h2>状态</h2>
        <div id="status" class="status"></div>
      </section>
    </aside>

    <main id="viewport">
      <canvas id="graphCanvas"></canvas>
      <div id="overlay" class="overlay">
        <p>正在加载 Three.js 依赖…</p>
      </div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="detailModal" class="modal-mask" hidden>
        <div class="modal">
          <div class="modal-head">
            <h3 class="modal-title"></h3>
            <button id="modalClose" class="modal-close" title="关闭" aria-label="关闭">&times;</button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-foot">
            <button id="modalOk" class="btn primary modal-ok">返回</button>
          </div>
        </div>
      </div>
      <div id="controls" class="hint"><span data-jz-icon="🖱"></span> 左键拖动旋转 · 滚轮缩放 · 右键平移 · 点击节点查看详情</div>
    </main>
  </div>

  <script src="/static/js/jz-icon.js?v=6"></script>
  <script type="module" src="js/app.js?v=20260923"></script>
</body>
</html>
